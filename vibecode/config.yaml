name: Vibe Code
description: Run the Mistral Vibe Code AI coding assistant inside Home Assistant to create automations, debug issues, and manage your smart home configuration
version: "1.6.1"
slug: vibecode
url: https://github.com/FireStarter75/hass-vibe-addon
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: application
boot: auto
init: true
ingress: true
ingress_port: 7681
ingress_stream: true
panel_icon: mdi:console
panel_title: Vibe Code
homeassistant_api: true
auth_api: true
hassio_api: true
hassio_role: manager
uart: true
map:
  - homeassistant_config:rw
  - ssl:ro
  - share:rw
  - media:rw
  - addon_config:rw
  - backup:ro
options:
  mistral_api_key: ""
  enable_mcp: true
  active_model: ""
  extra_models: []
  auto_models: true
  terminal_font_size: 14
  terminal_theme: dark
  working_directory: /homeassistant
  session_persistence: true
  auto_update_vibe: false
schema:
  mistral_api_key: password?
  enable_mcp: bool
  active_model: str?
  auto_models: bool
  extra_models:
    - name: str
      provider: str?
      alias: str?
      input_price: float?
      output_price: float?
      thinking: list(off|low|medium|high|max)?
  terminal_font_size: int(10,24)
  terminal_theme: list(dark|light)
  working_directory: str
  session_persistence: bool
  auto_update_vibe: bool
environment:
  TERM: xterm-256color
